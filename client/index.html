<!doctype html>
<html>
	<head>
		<title>TGM</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link href="css/index.css" rel="stylesheet" />
	</head>
	<body>
		<div class="inputs">
			<div class="text">Segment Count Top:</div>
			<input id="seg-count-top" type="range" min="0" max="200" step="4" value="12">	
			<div class="text">Segment Count Bot:</div>
			<input id="seg-count-bot" type="range" min="3" max="10" step="1" value="4">	
			<div id="seg-ratio" class="text"></div>
			<div class="text">Interpolation Count:</div>
			<input id="interpolation-count" type="range" min="2" max="20" step="1" value="5">	
			<div id="vertices" class="btn-type-1">Vertices</div>
		</div>
      <canvas id="canvas"></canvas>
		<script src="js/root.js" type="module"></script>
	</body>
</html>
